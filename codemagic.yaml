workflows:
  android-release:
    name: Flutter Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      flutter: stable
      java: 21
      groups:
        - google_credentials 
      
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.pub-cache
        
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
          
    scripts:
      - name: Verificar estrutura do Android
        script: |
          if [ ! -d "$CM_BUILD_DIR/android" ]; then
            echo "ERRO CRÍTICO: A pasta 'android' não foi encontrada no seu repositório!"
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/android/gradle/wrapper"
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Forçar Gradle 8.14 no wrapper
        script: |
          echo "distributionBase=GRADLE_USER_HOME" > "$CM_BUILD_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          echo "distributionPath=wrapper/dists" >> "$CM_BUILD_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip" >> "$CM_BUILD_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          echo "networkTimeout=10000" >> "$CM_BUILD_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          echo "validateDistributionUrl=true" >> "$CM_BUILD_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          echo "zipStoreBase=GRADLE_USER_HOME" >> "$CM_BUILD_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          echo "zipStorePath=wrapper/dists" >> "$CM_BUILD_DIR/android/gradle/wrapper/gradle-wrapper.properties"

      - name: Atualizar Android Gradle Plugin (AGP)
        script: |
          # Atualiza o AGP no arquivo settings.gradle
          sed -i '' 's/com.android.application" version "8.1.0"/com.android.application" version "8.11.1"/' "$CM_BUILD_DIR/android/settings.gradle"
          echo "--- Verificando AGP atualizado em settings.gradle ---"
          grep -A 2 "com.android.application" "$CM_BUILD_DIR/android/settings.gradle" || true

      - name: Adicionar flags de compatibilidade ao gradle.properties
        script: |
          echo "android.newDsl=false" >> "$CM_BUILD_DIR/android/gradle.properties"
          echo "android.builtInKotlin=false" >> "$CM_BUILD_DIR/android/gradle.properties"

      - name: Criar google-services.json
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo $GOOGLE_SERVICES_JSON > "$CM_BUILD_DIR/android/app/google-services.json"
          else
            echo "Aviso: GOOGLE_SERVICES_JSON não está definido."
          fi

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - seu-email@exemplo.com 
        notify:
          success: true
          failure: true
