workflows:
  android-release:
    name: Flutter Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      flutter: stable
      java: 21  # <-- ATUALIZADO: Usar Java 21 para corresponder ao ambiente do Gradle
      groups:
        - google_credentials # Contém a variável GOOGLE_SERVICES_JSON
        # - keystore_credentials # Descomente se precisar de assinatura de release
      
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.pub-cache
        
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
          
    scripts:
      - name: Configurar local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Atualizar versões do Gradle (Correção do erro de compatibilidade)
        script: |
          cd android
          # Força a atualização para uma versão do Gradle compatível com Java 21 (>= 8.4)
          ./gradlew wrapper --gradle-version 8.7
          cd ..

      - name: Criar google-services.json
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo $GOOGLE_SERVICES_JSON > $CM_BUILD_DIR/android/app/google-services.json
            echo "google-services.json criado com sucesso."
          else
            echo "Aviso: GOOGLE_SERVICES_JSON não está definido."
          fi

      - name: Analyze (Análise de código)
        script: |
          flutter analyze

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - seu-email@exemplo.com # Substitua pelo seu e-mail
        notify:
          success: true
          failure: true   
