workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable # Volta para o stable para suportar o novo método withValues
      java: 17
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Gerar pastas Android (Flutter Create)
        script: flutter create --platforms=android .

      - name: Forçar Compilação SDK 35
        script: |
          # Atualiza o SDK do Android para a versão 35 (exigida pelo Flutter moderno)
          perl -pi -e 's/compileSdk(Version)?\s*=?\s*\d+/compileSdk 35/g' android/app/build.gradle
          perl -pi -e 's/targetSdk(Version)?\s*=?\s*\d+/targetSdk 35/g' android/app/build.gradle
          echo "SDK do Android atualizado para 35 com sucesso."

      - name: Get packages
        script: flutter pub get

      - name: Criar google-services.json
        script: echo "$GOOGLE_SERVICES_JSON" > $CM_BUILD_DIR/android/app/google-services.json

      - name: Aplicar plugin Google Services
        script: |
          perl -pi -e 's/apply plugin: '\''com.android.application'\''/apply plugin: '\''com.android.application'\''\napply plugin: '\''com.google.gms.google-services'\''/g' android/app/build.gradle
          echo "Plugin do Firebase injetado."

      - name: Clean build
        script: flutter clean

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - leoniltonfernandesguaripuna@gmail.com
        notify:
          success: true
          failure: true
