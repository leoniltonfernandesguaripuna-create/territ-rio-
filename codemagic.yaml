workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Atualizar Flutter
        script: flutter upgrade --force

      - name: Gerar pastas Android (Flutter Create)
        script: flutter create --platforms=android .

      - name: Forçar Compilação SDK 35 Globalmente
        script: |
          # 1. Atualiza o app principal
          perl -pi -e 's/(compileSdkVersion|compileSdk)\s*=?\s*\d+/$1 35/g' android/app/build.gradle
          perl -pi -e 's/(targetSdkVersion|targetSdk)\s*=?\s*\d+/$1 35/g' android/app/build.gradle
          
          # 2. Força todos os subprojetos (como o 'printing') a usarem o SDK 35
          # Usa plugins.withId que é a forma correta e não gera o erro "afterEvaluate"
          cat >> android/build.gradle <<'EOF'

          subprojects {
              plugins.withId('com.android.application') {
                  android {
                      compileSdkVersion 35
                      defaultConfig {
                          targetSdkVersion 35
                      }
                  }
              }
              plugins.withId('com.android.library') {
                  android {
                      compileSdkVersion 35
                  }
              }
          }
          EOF
          echo "SDK 35 forçado em todos os módulos com sucesso."

      - name: Get packages
        script: flutter pub get

      - name: Criar google-services.json
        script: echo "$GOOGLE_SERVICES_JSON" > $CM_BUILD_DIR/android/app/google-services.json

      - name: Aplicar plugin Google Services
        script: |
          perl -pi -e 's/apply plugin: '\''com.android.application'\''/apply plugin: '\''com.android.application'\''\napply plugin: '\''com.google.gms.google-services'\''/g' android/app/build.gradle
          echo "Plugin do Firebase injetado."

      - name: Clean build
        script: flutter clean

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - leoniltonfernandesguaripuna@gmail.com
        notify:
          success: true
          failure: true
  
