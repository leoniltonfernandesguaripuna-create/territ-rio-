 workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        - firebase
    cache:
  cache_paths:
    - ~/.gradle/caches
    - ~/.gradle/wrapper
    - ~/.pub-cache
    scripts:
      - name: Gerar projeto Flutter completo
        script: flutter create --platforms=android --org com.leonilton .
      - name: Get packages
        script: flutter pub get
      - name: Atualizar versões do Gradle e AGP
        script: |
          perl -pi -e 's/com\.android\.application" version "[^"]*"/com.android.application" version "8.11.1"/g' android/settings.gradle
          perl -pi -e 's/com\.android\.library" version "[^"]*"/com.android.library" version "8.11.1"/g' android/settings.gradle
          perl -pi -e 's/org\.jetbrains\.kotlin\.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.1.0"/g' android/settings.gradle
          perl -pi -e 's|distributionUrl=.*gradle-.*-all\.zip|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
      - name: Criar google-services.json
        script: echo "$GOOGLE_SERVICES_JSON" > $CM_BUILD_DIR/android/app/google-services.json
      - name: Aplicar plugin Google Services
        script: |
          perl -pi -e 's/(apply plugin: .com\.android\.application.)/$1\napply plugin: "com.google.gms.google-services"/' android/app/build.gradle
          perl -pi -e 's/(classpath "org\.jetbrains\.kotlin:kotlin-gradle-plugin")/$1\n        classpath "com.google.gms:google-services:4.4.0"/' android/build.gradle
      - name: Analyze
        script: flutter analyze || true
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - leoniltonfernandesguaripuna@gmail.com
        notify:
          success: true
          failure: true
