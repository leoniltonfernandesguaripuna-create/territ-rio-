workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        - firebase # Se você criou um grupo no Codemagic com esse nome
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Get packages
        script: flutter pub get
        
      - name: Criar google-services.json
        script: echo "$GOOGLE_SERVICES_JSON" > $CM_BUILD_DIR/android/app/google-services.json
        
      - name: Aplicar plugin Google Services
        script: |
          sed -i '/apply plugin: .com.android.application/a apply plugin: '"'"'com.google.gms.google-services'"'"'' android/app/build.gradle
          
      - name: Analyze
        script: flutter analyze || true
        
      - name: Build APK
        script: flutter build apk --release
        
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
    publishing:
      email:
        recipients:
          - leoniltonfernandesguaripuna@gmail.com
        notify:
          success: true
          failure: true
