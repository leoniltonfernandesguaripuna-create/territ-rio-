workflows:
  android-release:
    name: Flutter Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      flutter: stable
      java: 21  # Obrigatório: O ambiente do Codemagic está usando Java 21
      groups:
        - google_credentials # Contém a variável GOOGLE_SERVICES_JSON
        # - keystore_credentials # Descomente se precisar de assinatura de release
      
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.pub-cache
        
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
          
    scripts:
      - name: Configurar local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Atualizar Gradle Wrapper para 8.7 (Correção definitiva)
        script: |
          # Este comando altera o arquivo de configuração do Gradle para a versão 8.7
          # que é compatível com o Java 21
          sed -i '' 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' $CM_BUILD_DIR/android/gradle/wrapper/gradle-wrapper.properties
          echo "--- Conteúdo atualizado do gradle-wrapper.properties ---"
          cat $CM_BUILD_DIR/android/gradle/wrapper/gradle-wrapper.properties

      - name: Criar google-services.json
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo $GOOGLE_SERVICES_JSON > $CM_BUILD_DIR/android/app/google-services.json
            echo "google-services.json criado com sucesso."
          else
            echo "Aviso: GOOGLE_SERVICES_JSON não está definido."
          fi

      - name: Analyze (Análise de código)
        script: |
          flutter analyze

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - seu-email@exemplo.com # Substitua pelo seu e-mail
        notify:
          success: true
          failure: true
