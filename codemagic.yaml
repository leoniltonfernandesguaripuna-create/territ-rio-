workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        - firebase # Se você criou um grupo no Codemagic com esse nome
    cache:
      cache_paths:
        - ~/.pub-cache
     --release
        
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
    publishing:
      email:
        recipients:
          - leoniltonfernandesguaripuna@gmail.com
        notify:
          success: true
          failure: true
