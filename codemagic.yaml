 workflows:
  android-release:
    name: Flutter Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1 # Ou linux_x2, dependendo da sua necessidade
    
    environment:
      flutter: stable
      java: 17 # O Gradle 8+ exige o Java 17
      groups:
        # Crie um grupo de variáveis de ambiente chamado "google_credentials" no painel do Codemagic
        # e adicione a variável GOOGLE_SERVICES_JSON com o conteúdo do seu arquivo google-services.json
        - google_credentials
        # Se você usar assinatura de release (keystore), adicione as variáveis aqui também
        # - keystore_credentials 
      
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.pub-cache
        
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
          
    scripts:
      - name: Configurar local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Atualizar versões do Gradle e AGP (Correção do erro)
        script: |
          cd android
          # Força a versão do Gradle para 8.2.2 para evitar o erro de compilação
          ./gradlew wrapper --gradle-version 8.2.2
          cd ..

      - name: Criar google-services.json
        script: |
          # Verifica se a variável de ambiente existe e cria o arquivo
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo $GOOGLE_SERVICES_JSON > $CM_BUILD_DIR/android/app/google-services.json
            echo "google-services.json criado com sucesso."
          else
            echo "Aviso: GOOGLE_SERVICES_JSON não está definido."
          fi

      - name: Analyze (Análise de código)
        script: |
          flutter analyze

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - seu-email@exemplo.com # Substitua pelo seu e-mail
        notify:
          success: true
          failure: true
